name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: placement-predict-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Verify Python sources compile
        run: python -m compileall -q flask_project tests tools
      - name: Verify installed dependencies
        run: pip check
      - name: Run the test suite
        run: pytest --strict-markers -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image (no push)
        run: docker build -t placement-predict:ci .
      - name: Smoke-test the container
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker run -d --rm -p 18080:7860 -e SECRET_KEY=ci-smoke placement-predict:ci)"
          cleanup() {
            docker stop "$cid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/api/health >/tmp/health.json; then
              break
            fi
            sleep 1
          done
          test -s /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          docker logs "$cid" 2>&1 | tail -n 80

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  visuals:
    runs-on: ubuntu-latest
    needs: pytest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and visual test dependencies
        run: pip install -r requirements.txt pytest playwright pillow
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Train the authoritative model artifacts
        run: python flask_project/train_artifact.py
      - name: Render the GitHub Pages snapshot from the trained bundle
        run: python flask_project/export_pages.py
      - name: Start the application
        env:
          SECRET_KEY: ci-visuals
        run: |
          nohup python flask_project/app.py > /tmp/placement-predict.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/api/health >/tmp/health.json; then
              cat /tmp/health.json
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5000/api/health
      - name: Capture every application stage and regenerate the demo GIF
        run: python tools/capture_visuals.py
      - name: Validate visual outputs
        run: |
          test -s screenshots/home.png
          test -s screenshots/upload.png
          test -s screenshots/features.png
          test -s screenshots/descriptive.png
          test -s screenshots/missing.png
          test -s screenshots/visualize.png
          test -s screenshots/preprocess.png
          test -s screenshots/train.png
          test -s screenshots/evaluate.png
          test -s screenshots/predict.png
          test -s screenshots/demo.gif
          test -s visuals_artifact/metrics.json
      - name: Upload authoritative visual bundle
        uses: actions/upload-artifact@v4
        with:
          name: placement-predict-authoritative-visuals
          path: |
            screenshots/
            docs/
            visuals_artifact/metrics.json
          if-no-files-found: error
      - name: Commit regenerated visuals on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "Rushmanth Nalluri"
          git config user.email "223413137+rushmanthnalluri@users.noreply.github.com"
          git add screenshots docs
          if git diff --cached --quiet; then
            echo "No generated visual changes to commit."
          else
            git commit -m "chore: refresh generated visuals [skip ci]"
            git push
          fi
